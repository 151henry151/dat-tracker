name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: dat-review-linux-x86_64
          - os: windows-2022
            artifact: dat-review-windows-x86_64.exe
          - os: macos-14
            artifact: dat-review-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra review --extra asr --extra dev

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio ffmpeg || true

      - name: Fetch ffmpeg to bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Chocolatey provides a system ffmpeg we can copy into packaging/.
            choco install ffmpeg -y
            dest="packaging/ffmpeg/windows-x86_64"
            mkdir -p "$dest"
            FFMPEG_ROOT="$(dirname "$(dirname "$(command -v ffmpeg)")")"
            cp -f "$FFMPEG_ROOT/bin/ffmpeg.exe" "$dest/ffmpeg.exe"
            cp -f "$FFMPEG_ROOT/bin/ffprobe.exe" "$dest/ffprobe.exe"
            cp -f "$FFMPEG_ROOT/bin/ffplay.exe" "$dest/ffplay.exe" || \
              cp -f "$FFMPEG_ROOT/bin/ffmpeg.exe" "$dest/ffplay.exe"
            ls -lh "$dest"
          else
            chmod +x packaging/fetch_ffmpeg.sh
            ./packaging/fetch_ffmpeg.sh
          fi

      - name: Install PyInstaller
        run: uv pip install "pyinstaller>=6.0"

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          uv run pyinstaller \
            --noconfirm \
            --clean \
            --distpath dist/pyinstaller \
            --workpath build/pyinstaller \
            packaging/dat-review.spec
          mkdir -p dist/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/pyinstaller/dat-review.exe "dist/release/${{ matrix.artifact }}"
          else
            cp dist/pyinstaller/dat-review "dist/release/${{ matrix.artifact }}"
            chmod +x "dist/release/${{ matrix.artifact }}"
          fi
          ls -lh dist/release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f -print
          find artifacts -type f -exec cp {} upload/ \;
          ls -lh upload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
