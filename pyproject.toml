[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dat-tracker"
version = "0.1.0"
description = "LLM-powered automatic tracking of untrimmed DAT transfers into etree-style FLAC packages for Archive.org."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henry" }]
dependencies = [
  "internetarchive>=4.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dat_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
