[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluegrass-dat-tracker"
version = "0.1.0"
description = "Track untrimmed live bluegrass DAT transfers into etree-style FLAC packages for Archive.org."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henry" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bluegrass_dat_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
