[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dat-tracker"
version = "0.1.0"
description = "LLM-powered automatic tracking of untrimmed DAT transfers into etree-style FLAC packages for Archive.org."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "151henry151" }]
dependencies = [
  "internetarchive>=4.0",
  "jsonschema>=4.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0",
]
review = [
  "textual>=1.0",
  "numpy>=1.26",
  "soundfile>=0.12",
  "sounddevice>=0.4",
  "mutagen>=1.47",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dat-review = "dat_tracker.review_cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/dat_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
